<title>My tool</title>
<!--
  TOOL STARTER TEMPLATE (Meta-science course, University of Innsbruck, Hackathon 3)

  HOW THIS FILE WORKS
  - Everything you (or the AI) need to change is in ONE place: the  const TOOL = { ... }  block below,
    between the marker lines "===== EDIT BELOW" and "===== EDIT ABOVE".
  - The last script (it starts with "DO NOT EDIT BELOW THIS LINE") draws the page and talks to the internet
    safely (see api.getJSON below). Leave it alone.
  - Open the page in a browser, fill in the settings, press "Run". After a change to this file, reload (F5).

  THE TOOL BLOCK HAS THESE PARTS:
    meta          title, the question the tool answers, author
    inputs        the settings: { id, label, type: "text" or "number", value (start value), min, max, help }
    presets       2-3 named real examples; each sets some input values
    run(p, api)   THE TOOL. async function. Gets the settings as p (e.g. p.topic, p.fromYear) and returns
                    { cards: [{label, value, note}],
                      chart: { type: "line" or "bar", title, xLabel, yLabel, x: [...], series: [{name, values}] , yMin, yMax },
                      table: { columns: ["...", ...], rows: [[cell, cell, ...], ...] } }
                  A table cell is a text/number, or { text: "...", href: "https://..." } for a link.
    takeaway(p, r) one or two plain sentences about the result r (computed from r, never fixed text)
    methodology   how / assumptions / references (real, checkable sources only)

  THE api OBJECT (already written and tested; use it for EVERY internet call):
    await api.getJSON(url)  -> the answer as a JavaScript object. It waits politely between calls
                               (Crossref: 1.2 s, others: 0.5 s), gives up after 20 s, retries 3 times
                               after "429 Too Many Requests", remembers answers in this browser
                               (a second run costs no calls), and in "sample" mode answers from
                               sample-data/sample.js instead of the internet.
    api.progress("text")    -> shows a status line, e.g. "Checking 3 of 24"
    api.asOfYear            -> the year to count "years since" from (this year, or the sample's year)
    api.mode                -> "live" or "sample"
    api.calls               -> how many real internet calls this run made so far

  Page address options: add  ?sample=1  to use the saved sample data,  ?autorun=1  to run at once.
-->
<style>
  :root { --ink:#1c1917; --ink2:#57534e; --line:#e7e5e4; --bg:#fafaf9; --card:#fff; --accent:#b45309; --accent2:#1d4ed8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); }
  header { padding:28px 32px 8px; max-width:1200px; margin:auto; }
  header h1 { margin:0 0 6px; font-size:30px; }
  header p { margin:0; color:var(--ink2); font-size:18px; }
  .tag { display:inline-block; font:12px/1 system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:24px; padding:16px 32px 40px; max-width:1200px; margin:auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  .panel h2 { font:600 13px/1 system-ui, sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); margin:0 0 14px; }

  .input .help { font-size:12px; color:var(--ink2); margin-top:2px; }
  .presets { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .presets button { font:13px system-ui, sans-serif; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .presets button:hover, .presets button.on { border-color:var(--accent); color:var(--accent); }
  .preset-note { font:13px system-ui, sans-serif; color:var(--ink2); min-height:18px; margin:-6px 0 12px; }
  .run { font:600 15px system-ui, sans-serif; padding:9px 16px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; width:100%; }
  .run:disabled { opacity:.5; cursor:wait; }
  .mode { font:13px system-ui, sans-serif; color:var(--ink2); margin-top:12px; display:flex; gap:6px; align-items:center; }
  .status { font:13px system-ui, sans-serif; color:var(--ink2); min-height:18px; margin:10px 0 0; }

  .cards { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:16px; }

  .card .l { font:12px system-ui, sans-serif; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; }

  details { margin-top:16px; font-family: system-ui, sans-serif; font-size:14px; line-height:1.5; }
  summary { cursor:pointer; font-weight:600; }
  table { border-collapse:collapse; width:100%; font:13px system-ui, sans-serif; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
  th { color:var(--ink2); font-weight:600; }

  svg text { font-family: system-ui, sans-serif; font-size:12px; fill: var(--ink2); }
  .legend { font:13px system-ui, sans-serif; display:flex; gap:16px; flex-wrap:wrap; margin-top:4px; }
  .legend span::before { content:""; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }
  .error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:12px; border-radius:8px; font:14px system-ui, sans-serif; white-space:pre-wrap; margin-bottom:12px; }
  .reset { font:13px system-ui, sans-serif; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-bottom:12px; }
  footer { max-width:1200px; margin:auto; padding:0 32px 32px; font:12px system-ui, sans-serif; color:var(--ink2); }

<script>
// Shows an error that stops the page from starting (for example a typo in the TOOL block) on the page itself.
window.addEventListener("error", function (e) {
  if (window.__shownStartError) return; window.__shownStartError = true;
  var show = function () { var d = document.createElement("div"); d.className = "error"; d.style.margin = "16px 32px";
    d.textContent = "The page could not start because of an error in the TOOL block:\n" + e.message + (e.lineno ? "  (line " + e.lineno + " of index.html)" : "") + "\n\nCopy this message into OpenCode and ask it to fix the problem. Change only the TOOL block.";
    document.body.prepend(d); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show); else show();
});
</script>

<body>
<header>
  <div class="tag">Meta-science tool</div>
  <h1 id="title"></h1>
  <p id="question"></p>
</header>
<main>
  <section class="panel"><h2>Settings</h2>
    <button id="reset" class="reset">↺ Reset to start values</button>
    <div class="presets" id="presets"></div><div class="preset-note" id="presetNote"></div>
    <div id="inputs"></div>
    <button id="run" class="run">Run</button>
    <label class="mode"><input type="checkbox" id="sampleMode"> Use saved sample data (no internet needed)</label>
    <div class="status" id="status"></div>
  </section>
  <section>
    <div id="notices"></div>
    <div class="cards" id="cards"></div>
    <div class="panel"><h2 id="chartTitle">Chart</h2><div id="chart"><p style="font:14px system-ui,sans-serif;color:#57534e">Press Run to see the result.</p></div><div class="legend" id="legend"></div></div>
    <div class="takeaway" id="takeaway"></div>
    <details open><summary>How this tool works</summary><div id="method"></div></details>
    <details><summary>Every result, one row each (check them!)</summary><div class="tablewrap" id="table"></div></details>
  </section>
</main>
<footer id="footer"></footer>

<script>
// ===== EDIT BELOW ===========================================================================
const TOOL = {
  meta: {
    title: "The file-drawer meter",
    question: "What share of preregistrations ever become a published paper?",
    author: "Your first name",
  },
  inputs: [
    { id: "topic",    label: "Topic (words to search OSF registrations for)", type: "text",   value: "anchoring", help: "Searches titles, descriptions and keywords" },
    { id: "fromYear", label: "Registered from year", type: "number", value: 2017, min: 2012, max: 2026, help: "First registration year" },
    { id: "toYear",   label: "Registered to year",   type: "number", value: 2018, min: 2012, max: 2026, help: "Last registration year" },
    { id: "maxRegs",  label: "Check at most this many registrations", type: "number", value: 40, min: 1, max: 100, help: "One Crossref call each, about 1.2 s per call" },
  ],
  presets: [
    { name: "Anchoring 2017–2018",      values: { topic: "anchoring",      fromYear: 2017, toYear: 2018 }, note: "A classic judgment-and-decision-making effect" },
    { name: "Ego depletion 2017–2018",  values: { topic: "ego depletion",  fromYear: 2017, toYear: 2018 }, note: "An effect at the centre of the replication crisis" },
    { name: "Growth mindset 2017–2018", values: { topic: "growth mindset", fromYear: 2017, toYear: 2018 }, note: "An education intervention with many preregistered trials" },
  ],
  async run(p, api) {
    // ----- helpers: the matching rules come word for word from the idea card -----
    const STOP = new Set(("a an the of and or in on for to with by from at as is are be study effect effects " +
      "using via vs versus its their into between among do does how what when why role pre registration " +
      "preregistration registered report protocol replication experiment part").split(" "));
    const IGNORE_NAME = new Set(["jr", "lab", "good"]); // surnames that do not count as shared authors
    const PAPER_TYPES = new Set(["journal-article", "proceedings-article", "book-chapter", "report", "dissertation", "monograph", "book"]);
    const unesc = t => String(t).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&");
    const flat = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); // lower case, accents removed
    const contentWords = t => flat(t).split(/[^a-z0-9]+/).filter(w => w.length >= 3 && !STOP.has(w));
    const normSurname = s => { const w = flat(s).replace(/[^a-z]/g, ""); return w.length >= 3 && !IGNORE_NAME.has(w) ? w : ""; };
    const kindOf = (type, doi) => {
      const d = String(doi || "").toLowerCase();
      if (type === "posted-content" || d.indexOf("10.2139/ssrn") === 0 || d.indexOf("10.31234/") === 0 || d.indexOf("10.31219/") === 0) return "preprint";
      return PAPER_TYPES.has(type) ? "paper" : ""; // any other type is never accepted
    };
    const yearOf = x => (x && x["date-parts"] && x["date-parts"][0]) ? x["date-parts"][0][0] : null;

    // ----- Rule 1: collect the registrations (call A, one call per year) -----
    const byId = new Map();
    for (let y = p.fromYear; y <= p.toYear; y++) {
      api.progress("Asking SHARE for registrations about '" + p.topic + "' from " + y);
      const url = "https://share.osf.io/trove/index-card-search?cardSearchText=" + encodeURIComponent(p.topic) +
        "&cardSearchFilter[resourceType]=Registration&cardSearchFilter[dateCreated]=" + y +
        "&page[size]=100&acceptMediatype=application/vnd.api%2Bjson";
      const data = await api.getJSON(url);
      const total = data.attributes ? data.attributes.totalResultCount : undefined;
      api.progress("Year " + y + ": about " + (typeof total === "number" ? total : (data.included || []).length) + " matching registrations");
      (data.included || []).forEach(card => {
        if (card.type !== "index-card") return;
        const m = (card.attributes || {}).resourceMetadata || {};
        const osfLink = m["@id"] || "";
        const id = osfLink ? osfLink.split("/").filter(Boolean).pop() : "";
        if (!id || byId.has(id)) return; // remove duplicates by OSF id
        const surnames = [];
        (m.creator || []).forEach(c => {
          let fam = (c["foaf:familyName"] && c["foaf:familyName"][0]) ? c["foaf:familyName"][0]["@value"] : "";
          if (!fam && c.name && c.name[0]) fam = String(c.name[0]["@value"]).trim().split(/\s+/).pop();
          const n = normSurname(fam);
          if (n && surnames.indexOf(n) < 0) surnames.push(n);
        });
        const dois = []; // OSF's own paper links, as DOIs
        const grab = v => {
          if (!v) return;
          let s = String(v);
          if (s.indexOf("https://doi.org/") === 0) s = s.slice("https://doi.org/".length);
          if (s.indexOf("10.17605/") === 0) return; // this is the registration itself
          if (s.indexOf("10.") === 0 && dois.indexOf(s) < 0) dois.push(s);
        };
        (m.hasPapersResource || []).forEach(x => grab(x && x["@id"]));
        (m["dcterms:relation"] || []).forEach(x => grab(x && x["@id"]));
        byId.set(id, {
          id: id, osfLink: osfLink,
          title: (m.title && m.title[0]) ? unesc(m.title[0]["@value"]) : "",
          date: (m.dateCreated && m.dateCreated[0]) ? String(m.dateCreated[0]["@value"]).slice(0, 10) : "", // the registration date
          surnames: surnames, dois: dois,
        });
      });
    }
    const regs = Array.from(byId.values()).sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.id.localeCompare(b.id));
    const regCount = regs.length;

    // ----- Rule 2: merge repeats (same title content words and at least one shared surname) -----
    const allStudies = [];
    regs.forEach(r => {
      const key = contentWords(r.title).join(" ");
      const twin = allStudies.find(s => s.key === key && r.surnames.some(n => s.surnames.indexOf(n) >= 0));
      if (twin) {
        twin.links.push(r.osfLink); // keep all their OSF links
        if (r.date && (!twin.date || r.date < twin.date)) twin.date = r.date; // keep the earliest date
        r.surnames.forEach(n => { if (twin.surnames.indexOf(n) < 0) twin.surnames.push(n); });
        r.dois.forEach(d => { if (twin.dois.indexOf(d) < 0) twin.dois.push(d); });
      } else {
        allStudies.push({ key: key, title: r.title, date: r.date, surnames: r.surnames.slice(), dois: r.dois.slice(), links: [r.osfLink] });
      }
    });
    const studies = allStudies.slice(0, p.maxRegs); // then keep the first maxRegs studies
    const cut = allStudies.length - studies.length;

    // ----- Rules 3 and 4: the OSF link first, otherwise search Crossref -----
    const rows = [];
    for (let i = 0; i < studies.length; i++) {
      const s = studies[i];
      let found = "", how = "", doi = "", pubYear = null, evidence = "";
      let osfPreprint = null; // an OSF-linked preprint is kept unless the search finds a paper

      if (s.dois.length) { // Rule 3: OSF names a paper itself (call B, use the first DOI)
        api.progress("Checking study " + (i + 1) + " of " + studies.length + " (OSF links a DOI)");
        doi = s.dois[0];
        try {
          const d = (await api.getJSON("https://api.crossref.org/works/" + doi)).message || {};
          pubYear = yearOf(d.issued);
          const kind = kindOf(d.type, doi);
          if (kind === "paper") { found = "paper"; how = "OSF link"; }
          else if (kind === "preprint") { osfPreprint = { doi: doi, year: pubYear }; doi = ""; pubYear = null; }
          else { doi = ""; pubYear = null; } // a type that is never accepted: search instead
        } catch (e) { pubYear = null; } // 404 etc.: keep the DOI with year unknown, and search instead
      }

      if (!found) { // Rule 4: search Crossref for the paper (call C)
        api.progress("Searching Crossref for study " + (i + 1) + " of " + studies.length);
        const url = "https://api.crossref.org/works?query.bibliographic=" + encodeURIComponent(s.title) +
          "&filter=from-pub-date:" + s.date + "&rows=5&select=DOI,title,author,issued,type&query.author=" +
          encodeURIComponent(s.surnames.slice(0, 3).join(" "));
        const data = await api.getJSON(url);
        const rWords = contentWords(s.title);
        let best = null;
        ((data.message || {}).items || []).forEach(it => {
          const cWords = contentWords((it.title && it.title[0]) ? it.title[0] : "");
          const ts = rWords.length ? rWords.filter(w => cWords.indexOf(w) >= 0).length / rWords.length : 0;
          const cNames = [];
          (it.author || []).forEach(a => { const n = normSurname(a.family); if (n && cNames.indexOf(n) < 0) cNames.push(n); });
          const a = s.surnames.filter(n => cNames.indexOf(n) >= 0).length;
          const kind = kindOf(it.type, it.DOI);
          if (!kind) return;
          const ok = (a >= 3 && ts >= 0.30) || (a >= 2 && ts >= 0.45) || (a >= 1 && ts >= 0.80 && rWords.length >= 3);
          if (!ok) return;
          const cand = { kind: kind, ts: ts, a: a, year: yearOf(it.issued), doi: it.DOI };
          if (!best) { best = cand; return; }
          // several accepted: paper before preprint, then higher ts (rounded to 0.1), then earliest year
          const better = (cand.kind === "paper" && best.kind !== "paper") ||
            (cand.kind === best.kind && (Math.round(cand.ts * 10) > Math.round(best.ts * 10) ||
              (Math.round(cand.ts * 10) === Math.round(best.ts * 10) && (cand.year || 9999) < (best.year || 9999))));
          if (better) best = cand;
        });
        if (best && best.kind === "paper") { found = "paper"; how = "Crossref match"; doi = best.doi; pubYear = best.year; evidence = Math.round(best.ts * 100) + "% / " + best.a; }
        else if (osfPreprint) { found = "preprint"; how = "OSF link"; doi = osfPreprint.doi; pubYear = osfPreprint.year; }
        else if (best) { found = "preprint"; how = "Crossref match"; doi = best.doi; pubYear = best.year; evidence = Math.round(best.ts * 100) + "% / " + best.a; }
      }

      const regYear = parseInt(s.date.slice(0, 4), 10);
      rows.push({
        title: s.title,
        osfLink: s.links[0],
        date: s.date,
        found: found, // "paper", "preprint" or "" (= nothing found; "not found" is not "not published")
        how: how, // "OSF link" or "Crossref match"
        doi: doi,
        doiLink: doi ? "https://doi.org/" + doi : "",
        year: pubYear,
        yearsToPaper: (found === "paper" && pubYear !== null && regYear) ? Math.max(0, pubYear - regYear) : null, // Rule 5
        evidence: evidence, // "title words % / shared surnames" (empty for OSF links)
        moreLinks: s.links.slice(1), // OSF links of merged repeats: "(+N more with this title)"
      });
    }

    // ----- the five cards -----
    const n = rows.length;
    const papers = rows.filter(r => r.found === "paper");
    const preprints = rows.filter(r => r.found === "preprint");
    const pct = k => n ? round(100 * k / n, 1) + "%" : "0%";
    const ys = papers.map(r => r.yearsToPaper).filter(v => v !== null).sort((a, b) => a - b);
    let median = "–";
    if (ys.length) { const mid = Math.floor(ys.length / 2); median = ys.length % 2 ? ys[mid] : round((ys[mid - 1] + ys[mid]) / 2, 1); }
    // ----- the chart: share with a paper, by years since registration -----
    const latest = rows.reduce((mx, r) => Math.max(mx, parseInt(r.date.slice(0, 4), 10) || 0), 0);
    const lastK = n ? Math.max(0, api.asOfYear - latest) : 0;
    const ks = []; for (let k = 0; k <= lastK; k++) ks.push(k);
    const yearsOf = r => { const y = parseInt(r.date.slice(0, 4), 10); return (r.year !== null && y) ? Math.max(0, r.year - y) : null; };
    const cumPct = ok => ks.map(k => round(100 * rows.filter(r => ok(r) && yearsOf(r) !== null && yearsOf(r) <= k).length / (n || 1), 1));

    // ----- the table: one row per study, so every result can be checked -----
    const tableRows = rows.map(r => [
      { text: r.title + (r.moreLinks.length ? " (+" + r.moreLinks.length + " more with this title)" : ""), href: r.osfLink },
      r.date,
      r.found === "paper" ? "paper" : r.found === "preprint" ? "preprint" : "nothing found",
      r.how,
      r.doi ? { text: r.doi, href: r.doiLink } : "",
      r.year === null ? "" : r.year,
      r.evidence,
    ]);
    return {
      cards: [
        { label: "Studies checked", value: n, note: "from " + regCount + " registrations, " + (regCount - allStudies.length) + " merged" + (cut > 0 ? ", " + cut + " not checked (limit)" : "") },
        { label: "Paper found", value: pct(papers.length), note: papers.length + " of " + n },
        { label: "Paper or preprint found", value: pct(papers.length + preprints.length), note: (papers.length + preprints.length) + " of " + n },
        { label: "Linked by OSF itself", value: rows.filter(r => r.how === "OSF link").length, note: "studies whose OSF page names a paper or preprint" },
        { label: "Median years to paper", value: median, note: "papers only" },
      ],
      chart: {
        type: "line",
        title: "Share with a paper found, by years since registration",
        xLabel: "Years since registration",
        yLabel: "% of studies",
        x: ks,
        yMin: 0, yMax: 100,
        series: [
          { name: "Paper found", values: cumPct(r => r.found === "paper") },
          { name: "Paper or preprint found", values: cumPct(r => r.found === "paper" || r.found === "preprint") },
        ],
      },
      table: {
        columns: ["Registration", "Registered", "Found", "How", "DOI", "Year", "Title words % / shared surnames"],
        rows: tableRows,
      },
      studies: rows, // one object per study, everything the results table needs
    };
  },
  takeaway(p, r) {
    if (r.cards[0].value === 0) {
      return "Nothing matched: no preregistered studies about '" + p.topic + "' were found on OSF for " + p.fromYear + "–" + p.toYear + ". Try a broader topic or more years.";
    }
    return "Of " + r.cards[0].value + " preregistered studies about '" + p.topic + "' on OSF, we found a published paper for " + r.cards[1].value + " and a paper or preprint for " + r.cards[2].value + ". This is a lower bound: 'not found' does not mean 'not published' (in a hand-check, this matching missed about 4 in 10 registrations that OSF says were published), and every 'found' should be opened and checked.";
  },
  methodology: {
    how: "For a topic and a range of years, the tool lists the OSF preregistrations (SHARE, OSF's search index) and looks for each one's paper: first a link that OSF itself holds, then a search in Crossref by title and authors. It shows the share with a paper found, by years since registration.",
    assumptions: [

<script>

    const ps = [...u.searchParams.entries()].filter(([k]) => !skip.has(k)).map(([k, v]) => [k, v.replace(/&amp;/g, "&").normalize("NFKD").toLowerCase().replace(/[^a-z0-9]/g, "")]).sort((a, b) => (a[0] + "=" + a[1]).localeCompare(b[0] + "=" + b[1]));

  if (status === 403) return "The API at " + host + " refused the call (403). Some APIs block automated browsers. Open the page in a normal browser window.";
  if (status === 0) return "The call to " + host + " did not get through (" + extra + "). Check the internet connection. If the API is down, tick 'Use saved sample data'.\nIf you see 'Failed to fetch' on every call: this API may not allow calls from web pages (CORS).";

function makeApi(mode) {

function notice(t) { if (![...$("notices").children].some(d => d.textContent === t)) { const d = document.createElement("div"); d.className = "notice"; d.textContent = t; $("notices").appendChild(d); } }

function niceTicks(lo, hi, n = 5) {
